<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1"><title>Rainbow Drift</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#c8e4de;color:#3b2942;font:16px system-ui}canvas{width:100%;height:100%;display:block;outline:0}#hud{position:fixed;inset:12px auto auto 12px;text-shadow:0 2px #fff8;pointer-events:none}b{font-size:24px}#touch{position:fixed;inset:auto 12px 14px;display:flex;justify-content:space-between}.g{display:flex;gap:8px}button{width:62px;height:58px;border:3px solid #fff8;border-radius:22px;background:#7b5c91dd;color:white;font-size:25px;box-shadow:0 5px #4d3b5c;touch-action:none}@media(pointer:fine){#touch{display:none}}</style><canvas id=c tabindex=0 aria-label="Rainbow Drift clay kart game. Drive with arrow keys or WASD. Press R to restart."></canvas><div id=hud><b>RAINBOW DRIFT</b><br><span id=s>0 km/h · lap 0</span></div><div id=touch><div class=g><button aria-label="Steer left" data-k=ArrowLeft>◀</button><button aria-label="Steer right" data-k=ArrowRight>▶</button></div><div class=g><button aria-label="Brake" data-k=ArrowDown>▼</button><button aria-label="Accelerate" data-k=ArrowUp>▲</button></div></div><script src=kart.js></script><script>
const C=c,X=C.getContext('2d'),Q={},tr=[],TAU=6.283185307,RAIN=['#ef5267','#f48a48','#f5cf58','#59c978','#5b92dc','#9867c1'];let x=0,y=205,a=Math.PI/2,v=0,lap=0,last=0,turn=0,prev=0,boost=0,charge=0,kx=0,ky=205,ka=a,pose=0,trailRun=0;
function reset(){x=kx=0;y=ky=205;a=ka=Math.PI/2;v=lap=turn=boost=charge=0;prev=Math.atan2(y/205,x/300);tr.length=0}reset();
C.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();Q[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=='r')reset()};C.onkeyup=e=>Q[e.key.toLowerCase()]=0;onblur=()=>{for(let k in Q)Q[k]=0};
document.querySelectorAll('button').forEach(b=>{let k=b.dataset.k.toLowerCase();b.onpointerdown=e=>(e.preventDefault(),Q[k]=1);b.onpointerup=b.onpointercancel=()=>Q[k]=0});
function road(){let w=C.width,h=C.height,cx=w/2,cy=h/2,R=Math.min(w/2.55,h/1.75),ry=R*.68;X.fillStyle='#b9ddd4';X.fillRect(0,0,w,h);X.lineCap='round';for(let i=0;i<5;i++){let q=i%2?1:-1,z=35+i*49,xx=cx+q*(R+54),yy=cy-ry+z;X.fillStyle='#735f6733';X.beginPath();X.ellipse(xx+4,yy+8,49,22,0,0,TAU);X.fill();X.fillStyle='#fff3e7';for(let j=0;j<3;j++){X.beginPath();X.ellipse(xx+(j-1)*25,yy-(j%2)*8,28-j*3,20+j*2,(j-1)*.08,0,TAU);X.fill()}}X.lineWidth=R*.37;X.strokeStyle='#51495b';X.shadowColor='#735f6777';X.shadowBlur=15;X.shadowOffsetY=10;X.beginPath();X.ellipse(cx,cy,R,ry,0,0,TAU);X.stroke();X.shadowColor='transparent';X.lineWidth=4;X.setLineDash([14,18]);X.strokeStyle='#d8c3cf';X.beginPath();X.ellipse(cx,cy,R,ry,0,0,TAU);X.stroke();X.setLineDash([]);X.lineWidth=9;for(let i=0;i<2;i++){X.strokeStyle=i?'#ed6495':'#67cad8';X.beginPath();X.ellipse(cx+(i?2:-2),cy+(i?1:-1),R*(i?1.18:.81),ry*(i?1.26:.73),0,0,TAU);X.stroke()}X.fillStyle='#fff';for(let i=0;i<8;i++){X.fillStyle=i%2?'#fff4e8':'#493d50';X.fillRect(cx-34+i*9,cy+ry-18,9,36)}return[cx,cy,R,ry]}
function kart(px,py,ang,scale){let faces=[];for(let o of K)for(let f of o[1]){let p=f.map(i=>{let q=o[0][i],u=q[0]*Math.cos(ang)-q[1]*Math.sin(ang),z=q[0]*Math.sin(ang)+q[1]*Math.cos(ang);return[px+u*scale,py+z*scale*.58-q[2]*scale*.7,z+q[2]*.2,u,z,q[2]]});faces.push([p,o[2]])}faces.sort((m,n)=>m[0].reduce((s,p)=>s+p[2],0)-n[0].reduce((s,p)=>s+p[2],0));X.shadowColor='#493d5066';X.shadowBlur=5;X.shadowOffsetY=5;for(let [p,col] of faces){let A=p[0],B=p[1],D=p[2],ux=B[3]-A[3],uy=B[4]-A[4],uz=B[5]-A[5],vx=D[3]-A[3],vy=D[4]-A[4],vz=D[5]-A[5],nz=ux*vy-uy*vx,nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,L=Math.hypot(nx,ny,nz)||1,k=.72+.25*Math.max(0,(-nx-ny+nz)/L);X.fillStyle=`rgb(${col.map(n=>n*k)})`;X.beginPath();X.moveTo(A[0],A[1]);for(let q of p.slice(1))X.lineTo(q[0],q[1]);X.closePath();X.fill()}X.shadowColor='transparent'}
function frame(t){let dt=Math.min((t-last)/1000||0,.1);last=t;let up=+(Q.arrowup||Q.w||0),down=+(Q.arrowdown||Q.s||0),left=+(Q.arrowleft||Q.a||0),right=+(Q.arrowright||Q.d||0);v+=(up*180-down*150+(boost>0)*120)*dt;boost=Math.max(0,boost-dt);v*=Math.pow(.986,dt*60);v=Math.max(-65,Math.min(285,v));let steer=(right-left)*(v<0?-1:1);a+=steer*Math.min(Math.abs(v)/90,1.45)*.58*dt;x+=Math.sin(a)*v*dt;y-=Math.cos(a)*v*dt;let rr=Math.hypot(x/300,y/205),onRoad=rr>.69&&rr<1.31;if(!onRoad)v*=Math.pow(.94,dt*60);let drifting=Math.abs(steer)&&Math.abs(v)>35&&onRoad;if(drifting){charge=Math.min(1.5,charge+dt);let bx=x-Math.sin(a)*20,by=y+Math.cos(a)*20,wx=Math.cos(a)*13,wy=Math.sin(a)*13;tr.push([bx-wx,by-wy,bx+wx,by+wy,1,trailRun,a])}else{if(charge>.3)boost=charge;if(charge)trailRun++;charge=0}if(tr.length>170)tr.splice(0,tr.length-170);let angle=Math.atan2(y/205,x/300),d=angle-prev;prev=angle;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;if(onRoad)turn+=d;lap=Math.floor(Math.abs(turn)/TAU);let [cx,cy,R,ry]=road();for(let j=1;j<tr.length;j++){let p=tr[j],q=tr[j-1];p[4]-=dt*.3;if(p[4]>0&&p[5]==q[5])for(let i=0;i<6;i++){let side=i<3?0:2,off=(i%3-1)*3;X.globalAlpha=p[4]*.9;X.strokeStyle=RAIN[i];X.lineWidth=3.5;X.beginPath();X.moveTo(cx+(q[side]+Math.cos(q[6])*off)*R/300,cy+(q[side+1]+Math.sin(q[6])*off)*ry/205);X.lineTo(cx+(p[side]+Math.cos(p[6])*off)*R/300,cy+(p[side+1]+Math.sin(p[6])*off)*ry/205);X.stroke()}}X.globalAlpha=1;if(t-pose>83){kx=x;ky=y;ka=a;pose=t}kart(cx+kx*R/300,cy+ky*ry/205,ka,31);s.textContent=Math.round(Math.abs(v))+' km/h · lap '+lap+(drifting?' · DRIFT '+Math.round(charge*100):boost?' · BOOST!':'');window.gameState={x,y,speed:v,lap,trail:tr.length,boost,charge,onRoad};requestAnimationFrame(frame)}
addEventListener('resize',()=>{C.width=innerWidth;C.height=innerHeight});dispatchEvent(new Event('resize'));c.focus();requestAnimationFrame(frame);
</script>
